<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      `viewport-fit=cover` is what lets the page paint into the notch area, which
      is required for env(safe-area-inset-*) to report anything but zero. Without
      it the insets are all 0 and the layout silently ignores the cutout - the
      same failure as SafeAreaView on Android.
    -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <meta name="theme-color" content="#166534" />

    <!-- iOS needs its own hints; it ignores much of the web app manifest. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pollito" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <title>Pollito</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
